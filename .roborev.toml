# Local RoboRev policy for SpotNote. The hook dispatches every commit;
# the exact-SHA receipt remains advisory evidence, never merge authority.
agent = "codex"
review_agent = "codex"
refine_agent = "codex"
model = "gpt-5.6-sol"
display_name = "SpotNote"
review_context_count = 0
post_commit_review = "commit"
review_reasoning = "maximum"
refine_reasoning = "maximum"
review_min_severity = "medium"
auto_close_passing_reviews = true
max_prompt_size = 120000

exclude_patterns = [
  ".env",
  "**/.env",
  ".env.local",
  "**/.env.local",
  ".env.development",
  "**/.env.development",
  ".env.development.local",
  "**/.env.development.local",
  ".env.production",
  "**/.env.production",
  ".env.production.local",
  "**/.env.production.local",
  ".env.staging",
  "**/.env.staging",
  ".env.staging.local",
  "**/.env.staging.local",
  ".env.test",
  "**/.env.test",
  ".env.test.local",
  "**/.env.test.local",
  "*.envrc",
  "**/*.envrc",
  "*.pem",
  "**/*.pem",
  "*.key",
  "**/*.key",
  "*.p12",
  "**/*.p12",
  "*.pfx",
  "**/*.pfx",
  "auth.json",
  "**/auth.json",
  "credentials.json",
  "**/credentials.json",
  "credentials.yaml",
  "**/credentials.yaml",
  "credentials.yml",
  "**/credentials.yml",
  "credentials.toml",
  "**/credentials.toml",
  "secrets.json",
  "**/secrets.json",
  "secrets.yaml",
  "**/secrets.yaml",
  "secrets.yml",
  "**/secrets.yml",
  "secrets.toml",
  "**/secrets.toml",
  "node_modules/**",
  "**/node_modules/**",
  "**/.build/**",
  "**/DerivedData/**",
  "**/.swiftpm/**",
  "*.app/**",
  "**/*.app/**",
  ".venv/**",
  "**/.venv/**",
  "**/__pycache__/**",
  "**/.pytest_cache/**",
  "**/*.egg-info/**",
  ".codegraph/**",
  "**/.codegraph/**",
  ".roborev/**",
  "**/.roborev/**",
  ".cache/**",
  "**/.cache/**",
  "**/tmp/**",
  "**/logs/**",
  "*.log",
  "**/*.log",
  "coverage/**",
  "**/coverage/**",
  "**/*.db",
  "**/*.db-wal",
  "**/*.db-shm",
  "**/*.sqlite",
  "**/*.sqlite3",
]

review_guidelines = """
A Swift and AppKit macOS note editor with Vim motions, Linear handoff, and vault-backed Markdown storage.
Review only the committed diff that remains after exclude_patterns are applied.
Prioritize concrete Medium, High, or Critical defects:
- functional regressions, incorrect state transitions, boundary mistakes, and silent failure;
- data loss, privacy or secret exposure, unsafe file/process behavior, and concurrency bugs;
- missing error handling or validation at user, filesystem, process, network, and persistence boundaries;
- tests that pass without exercising changed behavior, or missing regression coverage when a realistic failure could escape.

Do not report style-only findings, speculative rewrites, or generic requests for more tests.
"""
